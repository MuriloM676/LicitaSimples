<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta PNCP</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
        .result-card {
            margin-top: 20px;
        }
        .error-message {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Consulta PNCP</h1>
        <form id="consultaForm" class="mb-4">
            <div class="mb-3">
                <label for="dataInicial" class="form-label">Data Inicial:</label>
                <input type="date" id="dataInicial" name="dataInicial" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="dataFinal" class="form-label">Data Final:</label>
                <input type="date" id="dataFinal" name="dataFinal" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="pagina" class="form-label">Página:</label>
                <input type="number" id="pagina" name="pagina" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="cnpjOrgao" class="form-label">CNPJ do Órgão (opcional):</label>
                <input type="text" id="cnpjOrgao" name="cnpjOrgao" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary w-100">Consultar</button>
        </form>
        <div id="resultados" class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>Número do Contrato</th>
                        <th>Órgão</th>
                        <th>Valor</th>
                        <th>Data de Assinatura</th>
                        <th>Objeto</th>
                    </tr>
                </thead>
                <tbody id="resultadosContratosBody">
                    <!-- Os resultados serão inseridos aqui -->
                </tbody>
            </table>
        </div>

        <h2 class="text-center my-4">Consulta Atas</h2>
        <form id="consultaAtasForm" class="mb-4">
            <div class="mb-3">
                <label for="dataInicialAtas" class="form-label">Data Inicial:</label>
                <input type="date" id="dataInicialAtas" name="dataInicialAtas" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="dataFinalAtas" class="form-label">Data Final:</label>
                <input type="date" id="dataFinalAtas" name="dataFinalAtas" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="paginaAtas" class="form-label">Página:</label>
                <input type="number" id="paginaAtas" name="paginaAtas" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="cnpjOrgaoAtas" class="form-label">CNPJ do Órgão (opcional):</label>
                <input type="text" id="cnpjOrgaoAtas" name="cnpjOrgaoAtas" class="form-control">
            </div>
            <button type="submit" class="btn btn-secondary w-100">Consultar Atas</button>
        </form>
        <div id="resultadosAtas" class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>Número da Ata</th>
                        <th>Órgão</th>
                        <th>Valor</th>
                        <th>Data de Publicação</th>
                        <th>Objeto</th>
                    </tr>
                </thead>
                <tbody id="resultadosAtasBody">
                    <!-- Os resultados serão inseridos aqui -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function consultar(event) {
            event.preventDefault(); // Evitar o reload da página

            // Obter os valores dos campos de data
            const dataInicial = document.getElementById('dataInicial').value.replace(/-/g, '');
            const dataFinal = document.getElementById('dataFinal').value.replace(/-/g, '');
            const pagina = document.getElementById('pagina').value;
            const cnpjOrgao = document.getElementById('cnpjOrgao').value;

            // Montar os parâmetros da URL
            const queryParams = new URLSearchParams({
                dataInicial,
                dataFinal,
                pagina,
                ...(cnpjOrgao && { cnpjOrgao }) // Adicionar apenas se preenchido
            });

            try {
                const response = await fetch(`/consulta?${queryParams}`);
                const data = await response.json();

                if (response.ok) {
                    exibirResultados(data);
                } else {
                    exibirErro(data.error || 'Erro desconhecido');
                }
            } catch (error) {
                exibirErro('Erro ao consultar a API.');
                console.error(error);
            }
        }

        function exibirResultados(data) {
            console.log("Dados recebidos no frontend (Contratos):", data); // Log dos dados recebidos
            const resultadosBody = document.getElementById('resultadosContratosBody');
            resultadosBody.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${item.numeroContrato || 'N/A'}</td>
                        <td>${item.nomeOrgao || 'N/A'}</td>
                        <td>R$ ${item.valor || 'N/A'}</td>
                        <td>${item.dataAssinatura || 'N/A'}</td>
                        <td>${item.objetoContrato || 'N/A'}</td>
                    `;
                    resultadosBody.appendChild(row);
                });
            } else {
                resultadosBody.innerHTML = '<tr><td colspan="5" class="text-center">Nenhum contrato encontrado para os parâmetros fornecidos.</td></tr>';
            }
        }

        function exibirErro(mensagem) {
            const resultadosBody = document.getElementById('resultadosContratosBody');
            resultadosBody.innerHTML = `<tr><td colspan="5" class="error-message text-center">${mensagem}</td></tr>`;
        }

        document.getElementById('consultaForm').addEventListener('submit', consultar);

        async function consultarAtas(event) {
            event.preventDefault(); // Evitar o reload da página

            // Obter os valores dos campos de data
            const dataInicial = document.getElementById('dataInicialAtas').value.replace(/-/g, '');
            const dataFinal = document.getElementById('dataFinalAtas').value.replace(/-/g, '');
            const pagina = document.getElementById('paginaAtas').value;
            const cnpjOrgao = document.getElementById('cnpjOrgaoAtas').value;

            // Montar os parâmetros da URL
            const queryParams = new URLSearchParams({
                dataInicial,
                dataFinal,
                pagina,
                ...(cnpjOrgao && { cnpjOrgao }) // Adicionar apenas se preenchido
            });

            try {
                const response = await fetch(`/consulta-atas?${queryParams}`);
                const data = await response.json();

                if (response.ok) {
                    exibirResultadosAtas(data);
                } else {
                    exibirErroAtas(data.error || 'Erro desconhecido');
                }
            } catch (error) {
                exibirErroAtas('Erro ao consultar a API.');
                console.error(error);
            }
        }

        function exibirResultadosAtas(data) {
            console.log("Dados recebidos no frontend (Atas):", data); // Log dos dados recebidos
            const resultadosBody = document.getElementById('resultadosAtasBody');
            resultadosBody.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${item.numeroAta || 'N/A'}</td>
                        <td>${item.nomeOrgao || 'N/A'}</td>
                        <td>R$ ${item.valor || 'N/A'}</td>
                        <td>${item.dataPublicacao || 'N/A'}</td>
                        <td>${item.objetoAta || 'N/A'}</td>
                    `;
                    resultadosBody.appendChild(row);
                });
            } else {
                resultadosBody.innerHTML = '<tr><td colspan="5" class="text-center">Nenhuma ata encontrada para os parâmetros fornecidos.</td></tr>';
            }
        }

        function exibirErroAtas(mensagem) {
            const resultadosDiv = document.getElementById('resultadosAtasBody');
            resultadosDiv.innerHTML = `<tr><td colspan="5" class="error-message text-center">${mensagem}</td></tr>`;
        }

        document.getElementById('consultaAtasForm').addEventListener('submit', consultarAtas);
    </script>
</body>
</html>
