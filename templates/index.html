<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta PNCP</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
        .result-card {
            margin-top: 20px;
        }
        .error-message {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Consulta PNCP</h1>
        <form id="consultaForm" class="mb-4">
            <div class="mb-3">
                <label for="dataInicial" class="form-label">Data Inicial:</label>
                <input type="date" id="dataInicial" name="dataInicial" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="dataFinal" class="form-label">Data Final:</label>
                <input type="date" id="dataFinal" name="dataFinal" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="pagina" class="form-label">Página:</label>
                <input type="number" id="pagina" name="pagina" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="cnpjOrgao" class="form-label">CNPJ do Órgão (opcional):</label>
                <input type="text" id="cnpjOrgao" name="cnpjOrgao" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary w-100">Consultar</button>
        </form>
        <div id="resultados"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function consultar(event) {
            event.preventDefault(); // Evitar o reload da página

            // Obter os valores dos campos de data
            const dataInicial = document.getElementById('dataInicial').value.replace(/-/g, '');
            const dataFinal = document.getElementById('dataFinal').value.replace(/-/g, '');
            const pagina = document.getElementById('pagina').value;
            const cnpjOrgao = document.getElementById('cnpjOrgao').value;

            // Montar os parâmetros da URL
            const queryParams = new URLSearchParams({
                dataInicial,
                dataFinal,
                pagina,
                ...(cnpjOrgao && { cnpjOrgao }) // Adicionar apenas se preenchido
            });

            try {
                const response = await fetch(`/consulta?${queryParams}`);
                const data = await response.json();

                if (response.ok) {
                    exibirResultados(data);
                } else {
                    exibirErro(data.error || 'Erro desconhecido');
                }
            } catch (error) {
                exibirErro('Erro ao consultar a API.');
                console.error(error);
            }
        }

        function exibirResultados(data) {
            console.log("Dados recebidos no frontend:", data); // Log dos dados recebidos
            const resultadosDiv = document.getElementById('resultados');
            resultadosDiv.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card result-card';
                    card.innerHTML = `
                        <div class="card-body">
                            <h5 class="card-title">Contrato: ${item.numeroContrato || 'N/A'}</h5>
                            <p class="card-text">
                                <strong>Órgão:</strong> ${item.nomeOrgao || 'N/A'}<br>
                                <strong>Valor:</strong> R$ ${item.valor || 'N/A'}<br>
                                <strong>Data:</strong> ${item.dataAssinatura || 'N/A'}<br>
                                <strong>Objeto:</strong> ${item.objetoContrato || 'N/A'}
                            </p>
                        </div>
                    `;
                    resultadosDiv.appendChild(card);
                });
            } else {
                resultadosDiv.innerHTML = '<p class="text-center">Nenhum contrato encontrado para os parâmetros fornecidos.</p>';
            }
        }

        function exibirErro(mensagem) {
            const resultadosDiv = document.getElementById('resultados');
            resultadosDiv.innerHTML = `<p class="error-message text-center">${mensagem}</p>`;
        }

        document.getElementById('consultaForm').addEventListener('submit', consultar);
    </script>
</body>
</html>
